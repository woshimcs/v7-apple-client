# Veylo iOS → TestFlight.
# Libbox 用 sing-box v1.14.0（与这份 SFI 壳一致）。导出格式对齐现网 1.12+。
# 直接在本仓跑需要 APPLE_API_* secrets。桌面仓 v7-win-pc 已有这三把钥匙，
# 用 workflow_call 把它们传进来，避免把密钥再复制一份。
name: release-ios

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MARKETING_VERSION，如 1.0.0"
        required: false
        default: "1.0.0"
      git_ref:
        description: "要编的 v7-apple-client ref，留空=当前提交"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "1.0.0"
      git_ref:
        type: string
        required: true
    secrets:
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY_P8:
        required: true

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version || '1.0.0' }}
      TEAM_ID: "4534A24396"
      BUNDLE_ID: link.veylo.ios
    steps:
      - name: Checkout v7-apple-client
        uses: actions/checkout@v4
        with:
          repository: woshimcs/v7-apple-client
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}
          submodules: recursive

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build Libbox.xcframework (sing-box v1.14.0, iOS)
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          git clone --depth 1 --branch v1.14.0 https://github.com/SagerNet/sing-box.git sing-box-src
          (
            cd sing-box-src
            go run ./cmd/internal/build_libbox -target apple -platform ios
          )
          rm -rf Libbox.xcframework
          mv sing-box-src/Libbox.xcframework Libbox.xcframework
          # gomobile 有时打出 macOS 风格的 Versions/A，iOS 设备切片要摊平
          for framework in Libbox.xcframework/ios-*/Libbox.framework; do
            if [ -d "$framework/Versions/A" ]; then
              shallow="${framework}.shallow"
              rm -rf "$shallow"
              ditto "$framework/Versions/A" "$shallow"
              rm -rf "$framework"
              mv "$shallow" "$framework"
            fi
          done
          test -d Libbox.xcframework

      - name: Import App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appstore_private_keys"
          echo "$API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/appstore_private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/appstore_private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app record
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_DISABLE_ANIMATION: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/fl/fastlane
          cat > /tmp/fl/fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :ensure_app do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("API_KEY_ID"),
                issuer_id: ENV.fetch("API_ISSUER"),
                key_filepath: ENV.fetch("API_KEY_PATH"),
                duration: 1200,
                in_house: false
              )
              produce(
                api_key: api_key,
                app_identifier: ENV.fetch("BUNDLE_ID"),
                app_name: "Veylo",
                sku: "veylo-ios",
                language: "zh-Hans",
                team_id: ENV.fetch("TEAM_ID"),
                skip_devcenter: true
              )
            end
          end
          RUBY
          cd /tmp/fl && fastlane ensure_app

      - name: Archive SFI
        run: |
          set -euo pipefail
          rm -rf build/SFI.xcarchive
          xcodebuild archive \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            V7_API_BASE="https://veylo.link" \
            | xcbeautify

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/SFI.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist SFI/Upload.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER" \
            | xcbeautify
